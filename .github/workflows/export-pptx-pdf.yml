name: Export PowerPoint PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - decks/grill-me/dist/agent-skills-lt.pptx
      - .github/workflows/export-pptx-pdf.yml

permissions:
  contents: write

jobs:
  export-pptx-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-noto-cjk

      - name: Export PDF
        run: |
          libreoffice --headless --convert-to pdf --outdir decks/grill-me/dist decks/grill-me/dist/agent-skills-lt.pptx

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- decks/grill-me/dist/agent-skills-lt.pdf; then
            echo "No PDF changes"
          else
            git add decks/grill-me/dist/agent-skills-lt.pdf
            git commit -m "Export Agent Skills deck PDF"
            git push
          fi
